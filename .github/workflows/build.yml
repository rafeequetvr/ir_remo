name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# GitHub Releases-ലേക്ക് ഫയൽ അപ്‌ലോഡ് ചെയ്യാനുള്ള അനുമതി
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Flutter Project Automatically
        run: |
          flutter create --org com.custom --project-name ir_remote --platforms android app_build
          cp setup/main.dart app_build/lib/main.dart
          cp setup/MainActivity.kt app_build/android/app/src/main/kotlin/com/custom/ir_remote/MainActivity.kt
          sed -i 's/<application/<uses-permission android:name="android.permission.TRANSMIT_IR" \/>\n    <application/' app_build/android/app/src/main/AndroidManifest.xml

      - name: Add Dependencies & Build Release APK
        working-directory: app_build
        run: |
          flutter pub add shared_preferences
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Universal-IR-Remote.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Universal IR Remote v1.0.${{ github.run_number }}"
          body: "Direct APK download ready for installation."
          files: app_build/build/app/outputs/flutter-apk/Universal-IR-Remote.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
